name: ci_validation 

on:
    push:
      branches: [ "main" ]
    pull_request:
      branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: "ubuntu-latest"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3  # https://github.com/marketplace/actions/setup-miniconda
        with:
          activate-environment: gravitational-imaging
          environment-file: environment.yml
          python-version: 3.13
          auto-activate-base: false
      - run: |
          conda install nbconvert
      - name: Gather changed notebooks
        id: changed-files
        uses: tj-actions/changed-files@v46.0.1
        with:
          json: true
          escape_json: false
          safe_output: false
          quotepath: false
          files: |
            **/*.ipynb
      - name: Executing changed notebooks
        env:
          CHANGED_NOTEBOOKS: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          notebooks = json.loads(os.environ["CHANGED_NOTEBOOKS"])
          if not isinstance(notebooks, list) or any(not isinstance(path, str) for path in notebooks):
              raise ValueError("Changed notebooks must be a JSON array of paths")
          for notebook in notebooks:
              print(f"Reading from {notebook}...")
              subprocess.run(
                  [sys.executable, "-m", "nbconvert", "--template", "classic",
                   "--to", "html", "--execute", os.path.join(".", notebook)],
                  check=True,
              )
          PY
